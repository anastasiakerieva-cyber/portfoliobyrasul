<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Змейка — усовершенствованная</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d1117;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 20px;
        }

        .game-wrapper {
            background: #161b22;
            border-radius: 32px;
            padding: 30px 30px 35px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7);
            border: 1px solid #30363d;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .title {
            color: #f0f6fc;
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: -0.5px;
        }

        .title span {
            color: #58a6ff;
        }

        .stats {
            display: flex;
            gap: 24px;
            background: #0d1117;
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid #30363d;
        }

        .stats div {
            color: #8b949e;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .stats div strong {
            color: #f0f6fc;
            font-size: 1rem;
            margin-left: 4px;
        }

        .stats .score strong {
            color: #58a6ff;
        }

        .canvas-wrap {
            background: #0d1117;
            border-radius: 20px;
            padding: 8px;
            border: 1px solid #30363d;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #0d1117;
            border-radius: 16px;
            image-rendering: pixelated;
            touch-action: none;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            flex-wrap: wrap;
            gap: 14px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s ease;
            font-family: inherit;
        }

        button:hover {
            background: #30363d;
            border-color: #58a6ff;
            color: #f0f6fc;
        }

        button.primary {
            background: #238636;
            border-color: #238636;
            color: #fff;
        }

        button.primary:hover {
            background: #2ea043;
            border-color: #2ea043;
        }

        button.danger {
            background: #da3633;
            border-color: #da3633;
            color: #fff;
        }

        button.danger:hover {
            background: #f85149;
            border-color: #f85149;
        }

        .status {
            color: #8b949e;
            font-size: 0.9rem;
            font-weight: 500;
            background: #0d1117;
            padding: 6px 18px;
            border-radius: 40px;
            border: 1px solid #30363d;
        }

        .status .alive {
            color: #3fb950;
        }
        .status .dead {
            color: #f85149;
        }

        .footer-hint {
            margin-top: 16px;
            font-size: 0.75rem;
            color: #484f5e;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .footer-hint kbd {
            background: #21262d;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            border: 1px solid #30363d;
            color: #8b949e;
        }

        /* мобильные стрелки */
        .mobile-arrows {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 200px;
            margin: 12px auto 0;
        }

        .mobile-arrows button {
            padding: 14px 0;
            font-size: 1.4rem;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 16px;
            color: #c9d1d9;
            touch-action: manipulation;
        }

        .mobile-arrows .empty {
            visibility: hidden;
        }

        @media (max-width: 600px) {
            .game-wrapper { padding: 18px; }
            .header { flex-direction: column; align-items: stretch; }
            .title { text-align: center; font-size: 1.3rem; }
            .stats { justify-content: center; }
            .controls { flex-direction: column; align-items: stretch; }
            .btn-group { justify-content: center; }
            .status { text-align: center; }
            .mobile-arrows { display: grid; }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <!-- header -->
        <div class="header">
            <div class="title">🐍 <span>Змейка</span></div>
            <div class="stats">
                <div class="score">🎯 <strong id="scoreDisplay">0</strong></div>
                <div>🏆 <strong id="bestDisplay">0</strong></div>
            </div>
        </div>

        <!-- canvas -->
        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="500" height="500"></canvas>
        </div>

        <!-- control panel -->
        <div class="controls">
            <div class="btn-group">
                <button class="primary" id="startBtn">▶ Старт</button>
                <button id="pauseBtn">⏸ Пауза</button>
                <button class="danger" id="resetBtn">⟳ Сброс</button>
            </div>
            <div class="status" id="statusDisplay">
                <span class="alive">●</span> Игра не начата
            </div>
        </div>

        <!-- мобильные стрелки -->
        <div class="mobile-arrows" id="mobileArrows">
            <button class="empty"></button>
            <button data-dir="up">⬆</button>
            <button class="empty"></button>
            <button data-dir="left">⬅</button>
            <button data-dir="down">⬇</button>
            <button data-dir="right">➡</button>
        </div>

        <div class="footer-hint">
            <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> или <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · <kbd>Space</kbd> пауза
        </div>
    </div>

    <script>
        (function() {
            // ========== НАСТРОЙКИ ==========
            const BOARD_SIZE = 20;        // 20x20
            const CELL_SIZE = 500 / BOARD_SIZE;
            const TICK_INTERVAL_MS = 140;

            // ========== DOM ==========
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const bestDisplay = document.getElementById('bestDisplay');
            const statusDisplay = document.getElementById('statusDisplay');
            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const resetBtn = document.getElementById('resetBtn');

            // ========== СОСТОЯНИЕ ==========
            let snake = [];          // массив [x,y]
            let food = { x: 8, y: 10 };
            let direction = 'right';
            let nextDirection = 'right';
            let score = 0;
            let best = parseInt(localStorage.getItem('snakeBest')) || 0;
            let gameState = 'idle';   // idle | running | paused | gameover
            let gameInterval = null;
            let animationFrame = null;

            // препятствия (стены) — случайные, но не на старте
            let walls = [];

            // ========== ИНИЦИАЛИЗАЦИЯ ==========
            function initGame() {
                // стартовая змейка
                const mid = Math.floor(BOARD_SIZE / 2);
                snake = [
                    [mid, mid],
                    [mid - 1, mid],
                    [mid - 2, mid]
                ];
                direction = 'right';
                nextDirection = 'right';
                score = 0;
                gameState = 'idle';
                clearInterval(gameInterval);
                gameInterval = null;
                generateFood();
                generateWalls();
                updateScore();
                updateStatus('idle');
                draw();
            }

            // ========== ГЕНЕРАЦИЯ ЕДЫ ==========
            function generateFood() {
                const maxAttempts = 2000;
                for (let i = 0; i < maxAttempts; i++) {
                    const fx = Math.floor(Math.random() * BOARD_SIZE);
                    const fy = Math.floor(Math.random() * BOARD_SIZE);
                    if (!isOccupied(fx, fy)) {
                        food = { x: fx, y: fy };
                        return;
                    }
                }
                // если всё занято — победа!
                food = { x: -1, y: -1 };
            }

            // ========== ГЕНЕРАЦИЯ ПРЕПЯТСТВИЙ ==========
            function generateWalls() {
                walls = [];
                const count = 6 + Math.floor(Math.random() * 6); // 6–12 стен
                for (let i = 0; i < count; i++) {
                    const wx = Math.floor(Math.random() * BOARD_SIZE);
                    const wy = Math.floor(Math.random() * BOARD_SIZE);
                    if (!isOccupied(wx, wy) && !(wx === food.x && wy === food.y)) {
                        walls.push([wx, wy]);
                    }
                }
            }

            // ========== ПРОВЕРКА ЗАНЯТОСТИ ==========
            function isOccupied(x, y) {
                // змейка
                for (let seg of snake) {
                    if (seg[0] === x && seg[1] === y) return true;
                }
                // стены
                for (let w of walls) {
                    if (w[0] === x && w[1] === y) return true;
                }
                return false;
            }

            // ========== ОБНОВЛЕНИЕ СЧЁТА ==========
            function updateScore() {
                scoreDisplay.textContent = score;
                bestDisplay.textContent = best;
            }

            // ========== СТАТУС ==========
            function updateStatus(state, msg) {
                const statusMap = {
                    'idle': { text: 'Игра не начата', class: 'alive' },
                    'running': { text: 'Игра идёт', class: 'alive' },
                    'paused': { text: 'Пауза', class: 'alive' },
                    'gameover': { text: 'Игра окончена', class: 'dead' }
                };
                const info = statusMap[state] || statusMap['idle'];
                let fullText = info.text;
                if (msg) fullText += ' · ' + msg;
                statusDisplay.innerHTML = `<span class="${info.class}">●</span> ${fullText}`;
            }

            // ========== ШАГ ИГРЫ (TICK) ==========
            function step() {
                if (gameState !== 'running') return;

                // применяем направление
                direction = nextDirection;

                // вычисляем новую голову
                const head = snake[0];
                let newHeadX = head[0];
                let newHeadY = head[1];

                switch (direction) {
                    case 'up':    newHeadY--; break;
                    case 'down':  newHeadY++; break;
                    case 'left':  newHeadX--; break;
                    case 'right': newHeadX++; break;
                }

                // проверка на выход за поле (смерть)
                if (newHeadX < 0 || newHeadX >= BOARD_SIZE || newHeadY < 0 || newHeadY >= BOARD_SIZE) {
                    gameOver();
                    return;
                }

                // проверка на столкновение со стеной
                for (let w of walls) {
                    if (w[0] === newHeadX && w[1] === newHeadY) {
                        gameOver();
                        return;
                    }
                }

                // проверка на столкновение с собой (кроме хвоста)
                const tail = snake[snake.length - 1];
                for (let i = 0; i < snake.length - 1; i++) {
                    if (snake[i][0] === newHeadX && snake[i][1] === newHeadY) {
                        gameOver();
                        return;
                    }
                }

                // двигаем змейку
                const newSnake = [[newHeadX, newHeadY], ...snake];

                // проверка на еду
                const ate = (newHeadX === food.x && newHeadY === food.y);

                if (ate) {
                    snake = newSnake; // хвост не удаляем (растём)
                    score++;
                    if (score > best) {
                        best = score;
                        localStorage.setItem('snakeBest', String(best));
                        updateScore();
                    }
                    updateScore();
                    generateFood();
                    // если еды нет — победа!
                    if (food.x === -1) {
                        gameWin();
                        return;
                    }
                    // добавляем новую стену каждые 5 очков (усложнение)
                    if (score % 5 === 0 && score > 0) {
                        addRandomWall();
                    }
                } else {
                    // убираем хвост
                    snake = newSnake.slice(0, -1);
                }

                draw();
            }

            // ========== ДОБАВЛЕНИЕ СТЕНЫ ==========
            function addRandomWall() {
                const maxAttempts = 500;
                for (let i = 0; i < maxAttempts; i++) {
                    const wx = Math.floor(Math.random() * BOARD_SIZE);
                    const wy = Math.floor(Math.random() * BOARD_SIZE);
                    if (!isOccupied(wx, wy) && !(wx === food.x && wy === food.y)) {
                        walls.push([wx, wy]);
                        return;
                    }
                }
            }

            // ========== GAME OVER ==========
            function gameOver() {
                if (gameState === 'gameover') return;
                gameState = 'gameover';
                clearInterval(gameInterval);
                gameInterval = null;
                updateStatus('gameover', `Счёт: ${score}`);
                draw();
            }

            // ========== ПОБЕДА ==========
            function gameWin() {
                gameState = 'gameover';
                clearInterval(gameInterval);
                gameInterval = null;
                updateStatus('gameover', '🏆 ПОБЕДА! Вы заполнили поле!');
                draw();
            }

            // ========== ОТРИСОВКА ==========
            function draw() {
                if (animationFrame) cancelAnimationFrame(animationFrame);
                animationFrame = requestAnimationFrame(() => {
                    ctx.clearRect(0, 0, 500, 500);

                    // сетка (очень слабая)
                    ctx.strokeStyle = '#1c2333';
                    ctx.lineWidth = 0.5;
                    for (let i = 0; i <= BOARD_SIZE; i++) {
                        ctx.beginPath();
                        ctx.moveTo(i * CELL_SIZE, 0);
                        ctx.lineTo(i * CELL_SIZE, 500);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(0, i * CELL_SIZE);
                        ctx.lineTo(500, i * CELL_SIZE);
                        ctx.stroke();
                    }

                    // стены
                    for (let w of walls) {
                        ctx.fillStyle = '#6e7681';
                        ctx.shadowColor = 'rgba(0,0,0,0.3)';
                        ctx.shadowBlur = 6;
                        ctx.fillRect(w[0] * CELL_SIZE + 2, w[1] * CELL_SIZE + 2, CELL_SIZE - 4, CELL_SIZE - 4);
                        ctx.shadowBlur = 0;
                    }

                    // змейка
                    for (let i = 0; i < snake.length; i++) {
                        const [x, y] = snake[i];
                        const isHead = (i === 0);
                        const gradient = ctx.createRadialGradient(
                            x * CELL_SIZE + 6, y * CELL_SIZE + 6, 2,
                            x * CELL_SIZE + 12, y * CELL_SIZE + 12, 14
                        );
                        if (isHead) {
                            gradient.addColorStop(0, '#58a6ff');
                            gradient.addColorStop(1, '#1f6feb');
                        } else {
                            const t = i / snake.length;
                            const r = Math.round(40 + t * 20);
                            const g = Math.round(200 - t * 60);
                            const b = Math.round(100 + t * 30);
                            gradient.addColorStop(0, `rgb(${r}, ${g}, ${b})`);
                            gradient.addColorStop(1, `rgb(${r-20}, ${g-30}, ${b-20})`);
                        }
                        ctx.fillStyle = gradient;
                        ctx.shadowColor = isHead ? 'rgba(88,166,255,0.3)' : 'rgba(0,0,0,0.2)';
                        ctx.shadowBlur = isHead ? 12 : 4;
                        ctx.beginPath();
                        ctx.roundRect(x * CELL_SIZE + 2, y * CELL_SIZE + 2, CELL_SIZE - 4, CELL_SIZE - 4, 6);
                        ctx.fill();
                        ctx.shadowBlur = 0;

                        // глаза у головы
                        if (isHead) {
                            ctx.fillStyle = '#f0f6fc';
                            let ex1, ey1, ex2, ey2;
                            const off = 5;
                            switch (direction) {
                                case 'up':
                                    ex1 = x * CELL_SIZE + 6; ey1 = y * CELL_SIZE + 6;
                                    ex2 = x * CELL_SIZE + 14; ey2 = y * CELL_SIZE + 6;
                                    break;
                                case 'down':
                                    ex1 = x * CELL_SIZE + 6; ey1 = y * CELL_SIZE + 14;
                                    ex2 = x * CELL_SIZE + 14; ey2 = y * CELL_SIZE + 14;
                                    break;
                                case 'left':
                                    ex1 = x * CELL_SIZE + 6; ey1 = y * CELL_SIZE + 6;
                                    ex2 = x * CELL_SIZE + 6; ey2 = y * CELL_SIZE + 14;
                                    break;
                                case 'right':
                                    ex1 = x * CELL_SIZE + 14; ey1 = y * CELL_SIZE + 6;
                                    ex2 = x * CELL_SIZE + 14; ey2 = y * CELL_SIZE + 14;
                                    break;
                                default:
                                    ex1 = x * CELL_SIZE + 14; ey1 = y * CELL_SIZE + 6;
                                    ex2 = x * CELL_SIZE + 14; ey2 = y * CELL_SIZE + 14;
                            }
                            ctx.beginPath();
                            ctx.arc(ex1, ey1, 3, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.beginPath();
                            ctx.arc(ex2, ey2, 3, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.fillStyle = '#0d1117';
                            ctx.beginPath();
                            ctx.arc(ex1 + (direction === 'right' ? 1.5 : direction === 'left' ? -1.5 : 0),
                                    ey1 + (direction === 'down' ? 1.5 : direction === 'up' ? -1.5 : 0),
                                    1.2, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.beginPath();
                            ctx.arc(ex2 + (direction === 'right' ? 1.5 : direction === 'left' ? -1.5 : 0),
                                    ey2 + (direction === 'down' ? 1.5 : direction === 'up' ? -1.5 : 0),
                                    1.2, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }

                    // еда (с анимацией пульсации)
                    if (food.x >= 0 && food.y >= 0) {
                        const pulse = 1 + 0.08 * Math.sin(Date.now() / 200);
                        const cx = food.x * CELL_SIZE + CELL_SIZE / 2;
                        const cy = food.y * CELL_SIZE + CELL_SIZE / 2;
                        const rad = (CELL_SIZE / 2 - 3) * pulse;
                        const gradient = ctx.createRadialGradient(cx - 4, cy - 4, 2, cx, cy, rad);
                        gradient.addColorStop(0, '#f0883e');
                        gradient.addColorStop(0.7, '#da3633');
                        gradient.addColorStop(1, '#8b1f1f');
                        ctx.shadowColor = 'rgba(218,54,51,0.5)';
                        ctx.shadowBlur = 18;
                        ctx.beginPath();
                        ctx.arc(cx, cy, rad, 0, Math.PI * 2);
                        ctx.fillStyle = gradient;
                        ctx.fill();
                        ctx.shadowBlur = 0;

                        // блик
                        ctx.fillStyle = 'rgba(255,255,255,0.25)';
                        ctx.beginPath();
                        ctx.arc(cx - 4, cy - 5, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // если игра окончена — полупрозрачный overlay
                    if (gameState === 'gameover') {
                        ctx.fillStyle = 'rgba(0,0,0,0.5)';
                        ctx.fillRect(0, 0, 500, 500);
                        ctx.fillStyle = '#f0f6fc';
                        ctx.font = 'bold 28px Segoe UI, system-ui, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        const msg = (score === BOARD_SIZE * BOARD_SIZE - walls.length - snake.length) ? '🏆 ПОБЕДА!' : '💀 ИГРА ОКОНЧЕНА';
                        ctx.fillText(msg, 250, 240);
                        ctx.font = '18px Segoe UI, system-ui, sans-serif';
                        ctx.fillStyle = '#8b949e';
                        ctx.fillText(`Счёт: ${score}`, 250, 290);
                    }

                    if (gameState === 'idle') {
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        ctx.fillRect(0, 0, 500, 500);
                        ctx.fillStyle = '#8b949e';
                        ctx.font = '20px Segoe UI, system-ui, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('Нажмите «Старт»', 250, 250);
                    }

                    if (gameState === 'paused') {
                        ctx.fillStyle = 'rgba(0,0,0,0.4)';
                        ctx.fillRect(0, 0, 500, 500);
                        ctx.fillStyle = '#f0f6fc';
                        ctx.font = 'bold 30px Segoe UI, system-ui, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('⏸ ПАУЗА', 250, 250);
                    }

                    animationFrame = null;
                });
            }

            // ========== УПРАВЛЕНИЕ ==========
            function startGame() {
                if (gameState === 'running') return;
                if (gameState === 'idle' || gameState === 'gameover') {
                    initGame();
                }
                gameState = 'running';
                updateStatus('running');
                if (gameInterval) clearInterval(gameInterval);
                gameInterval = setInterval(step, TICK_INTERVAL_MS);
                draw();
            }

            function togglePause() {
                if (gameState === 'running') {
                    gameState = 'paused';
                    clearInterval(gameInterval);
                    gameInterval = null;
                    updateStatus('paused');
                    draw();
                } else if (gameState === 'paused') {
                    gameState = 'running';
                    updateStatus('running');
                    gameInterval = setInterval(step, TICK_INTERVAL_MS);
                    draw();
                }
            }

            function resetGame() {
                clearInterval(gameInterval);
                gameInterval = null;
                initGame();
                draw();
            }

            // ========== УПРАВЛЕНИЕ С КЛАВИАТУРЫ ==========
            function setDirection(newDir) {
                const opposites = { up: 'down', down: 'up', left: 'right', right: 'left' };
                if (newDir !== opposites[direction] || snake.length === 1) {
                    nextDirection = newDir;
                }
            }

            document.addEventListener('keydown', (e) => {
                const key = e.key;
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Space'].includes(key)) {
                    e.preventDefault();
                }
                switch (key) {
                    case 'ArrowUp':    setDirection('up'); break;
                    case 'ArrowDown':  setDirection('down'); break;
                    case 'ArrowLeft':  setDirection('left'); break;
                    case 'ArrowRight': setDirection('right'); break;
                    case 'w': case 'W': setDirection('up'); break;
                    case 's': case 'S': setDirection('down'); break;
                    case 'a': case 'A': setDirection('left'); break;
                    case 'd': case 'D': setDirection('right'); break;
                    case ' ': case 'Space': togglePause(); break;
                }
            });

            // ========== МОБИЛЬНЫЕ КНОПКИ ==========
            document.querySelectorAll('[data-dir]').forEach(btn => {
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    setDirection(btn.dataset.dir);
                });
                btn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    setDirection(btn.dataset.dir);
                });
            });

            // ========== КНОПКИ ИНТЕРФЕЙСА ==========
            startBtn.addEventListener('click', startGame);
            pauseBtn.addEventListener('click', togglePause);
            resetBtn.addEventListener('click', resetGame);

            // ========== ИНИЦИАЛИЗАЦИЯ ==========
            initGame();

            // поддержка roundRect
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
                    const r = typeof radii === 'number' ? radii : (radii || 0);
                    this.moveTo(x + r, y);
                    this.lineTo(x + w - r, y);
                    this.quadraticCurveTo(x + w, y, x + w, y + r);
                    this.lineTo(x + w, y + h - r);
                    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    this.lineTo(x + r, y + h);
                    this.quadraticCurveTo(x, y + h, x, y + h - r);
                    this.lineTo(x, y + r);
                    this.quadraticCurveTo(x, y, x + r, y);
                    this.closePath();
                    return this;
                };
            }

            // перерисовка при пульсации еды
            let pulseInterval = setInterval(() => {
                if (gameState === 'running' || gameState === 'paused' || gameState === 'idle') {
                    draw();
                }
            }, 150);

            window.addEventListener('beforeunload', () => {
                clearInterval(pulseInterval);
            });

        })();
    </script>
